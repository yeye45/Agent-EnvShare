<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Agent-EnvShare icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#334155" stroke-width="2"/>
  <!-- Connection lines from central registry hub to agent nodes -->
  <g stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <line x1="64" y1="64" x2="34" y2="38"/>
    <line x1="64" y1="64" x2="94" y2="38"/>
    <line x1="64" y1="64" x2="34" y2="92"/>
    <line x1="64" y1="64" x2="94" y2="92"/>
  </g>
  <!-- Agent satellite nodes -->
  <circle cx="34" cy="38" r="10" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
  <circle cx="94" cy="38" r="10" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
  <circle cx="34" cy="92" r="10" fill="#0F172A" stroke="#22C55E" stroke-width="3"/>
  <circle cx="94" cy="92" r="10" fill="#0F172A" stroke="#22C55E" stroke-width="3"/>
  <!-- Central shared environment registry cube -->
  <rect x="46" y="46" width="36" height="36" rx="10" fill="url(#accent)"/>
  <path d="M56 60h16M56 66h12M56 72h8" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
</svg>
